id: py-secret-env
language: Python
severity: warning
message: Reads a credential-like environment variable
rule:
  any:
    - pattern: os.environ[$K]
    - pattern: os.environ.get($$$)
    - pattern: os.getenv($$$)
  regex: '(?i)(token|secret|passw|credential|private|apikey|api_key|_key\b|\bkey_|(^|[^a-z0-9])(npm|github|actions|aws|azure|gcp|google|gitlab|ci_job|circle|travis|vercel|netlify|slack|stripe)_)'
